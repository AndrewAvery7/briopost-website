name: Validate website
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # check.mjs compares each page's last commit date with its sitemap lastmod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check.mjs
